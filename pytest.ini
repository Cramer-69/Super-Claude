[pytest]
# Put the repository root on sys.path so tests can import the top-level
# packages (conductor, config, utils, ...). Using a repo-level ini (rather
# than a conftest.py) also anchors pytest's rootdir here, so the path fix
# applies no matter which directory pytest is invoked from — including
# `pytest /abs/path/to/tests`, where a parent-level conftest.py would not be
# discovered.
pythonpath = .
