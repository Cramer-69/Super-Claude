<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conductor</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conductor">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="mask-icon" href="/static/icon.svg" color="#EA6842">
<meta name="theme-color" content="#FBFBFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211917" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F6F5; --surface:#FBFBFB; --surface-2:#F0EEED;
  --text:#211917; --text-2:#7D655E; --text-3:#9A857E;
  --border:#E4DEDD;
  --brand:#EA6842; --brand-press:#D74318; --brand-soft:#FCEDE8;
  --ok:#259D43; --err:#DC422A; --focus:#61AAF2;
  --user-bubble:#F0EEED; --agent-bubble:#FCEDE8;
  --shadow:0 1px 2px rgba(33,25,23,.06), 0 8px 24px rgba(33,25,23,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#211917; --surface:#342723; --surface-2:#2C211E;
    --text:#F0EEED; --text-2:#BFB4B0; --text-3:#9A857E;
    --border:#4E3832;
    --brand:#EA6842; --brand-press:#F5997F; --brand-soft:#3A241E;
    --ok:#4FBF6C; --err:#F5997F;
    --user-bubble:#4E3832; --agent-bubble:#3A241E;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#211917; --surface:#342723; --surface-2:#2C211E;
  --text:#F0EEED; --text-2:#BFB4B0; --text-3:#9A857E;
  --border:#4E3832;
  --brand:#EA6842; --brand-press:#F5997F; --brand-soft:#3A241E;
  --ok:#4FBF6C; --err:#F5997F;
  --user-bubble:#4E3832; --agent-bubble:#3A241E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.shell{max-width:640px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}

/* header */
.masthead{display:flex;align-items:center;gap:12px;padding:2px 2px 4px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.masthead h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.masthead p{margin:1px 0 0;font-size:12.5px;color:var(--text-3)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}

/* conversation */
#conversation{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;height:400px;overflow-y:auto;box-shadow:var(--shadow);
}
#messages{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--text-3);padding:56px 16px}
.empty strong{display:block;color:var(--text-2);font-weight:600;font-size:15px;margin-bottom:4px}

/* message bubbles — app.js sets these class names, do not rename */
.message{max-width:86%;width:fit-content;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* composer */
.composer{display:flex;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
#textInput{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font:inherit;font-size:15px;padding:9px 8px;min-width:0;
}
#textInput::placeholder{color:var(--text-3)}
#sendButton{
  background:var(--brand);color:#fff;border:none;border-radius:10px;
  padding:10px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;
  transition:background .15s ease,transform .08s ease;
}
#sendButton:hover{background:var(--brand-press)}
#sendButton:active{transform:scale(.97)}

/* mic */
.mic-row{display:flex;justify-content:center;padding:8px 0 2px}
#micButton{
  width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;
  background:var(--brand);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(234,104,66,.32);
  transition:transform .12s ease,background .15s ease;
}
#micButton:hover{background:var(--brand-press)}
#micButton:active{transform:scale(.93)}
#micButton.recording{background:var(--err);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(220,66,42,.32)}50%{box-shadow:0 6px 30px rgba(220,66,42,.55)}}

#status{text-align:center;color:var(--text-3);font-size:13px;min-height:20px}

/* recording waves */
#recordingIndicator{display:flex;justify-content:center;align-items:center;gap:4px;height:34px}
#recordingIndicator.hidden{display:none}
.wave{width:4px;height:14px;background:var(--brand);border-radius:4px;animation:wave 1.1s ease-in-out infinite}
.wave:nth-child(2){animation-delay:.1s}.wave:nth-child(3){animation-delay:.2s}
.wave:nth-child(4){animation-delay:.3s}.wave:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{height:10px}50%{height:30px}}

/* settings */
.settings{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.settings summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--text-2);list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"›";float:right;color:var(--text-3);transition:transform .2s}
.settings[open] summary::after,details[open] > summary::after{transform:rotate(90deg);display:inline-block}
.settings label{display:block;font-size:12.5px;color:var(--text-3);margin:14px 0 6px}
#voiceSelect{
  width:100%;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;outline:none;
}
#voiceSelect:focus-visible,#textInput:focus-visible,#sendButton:focus-visible,#micButton:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}

/* ── shims for utility classes app.js injects at runtime ── */
.hidden{display:none!important}
.p-4{padding:11px 14px}
.rounded-2xl{border-radius:14px}
.rounded-lg{border-radius:10px}
.text-xs{font-size:12.5px}
.text-sm{font-size:14.5px}
.text-center{text-align:center}
.text-white{color:var(--text)}
.ml-8{margin-left:auto}
.mr-8{margin-right:auto}
.bg-white\/20{background:var(--user-bubble)}
.bg-blue-500\/30{background:var(--agent-bubble)}
.bg-white\/10{background:transparent;color:var(--text-3);font-size:12.5px}
.glass{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text)}
.px-4{padding-left:14px;padding-right:14px}
.py-2{padding-top:8px;padding-bottom:8px}
.fixed{position:fixed}
.bottom-4{bottom:16px}
.right-4{right:16px}
.opacity-75{opacity:.75}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">

  <div class="masthead">
    <div class="mark">C</div>
    <div>
      <h1>Conductor</h1>
      <p>Voice agent with memory</p>
    </div>
    <div class="live"><i></i>Ready</div>
  </div>

  <div id="conversation">
    <div id="messages">
      <div class="empty">
        <strong>Start talking</strong>
        Tap the microphone, or type below.
      </div>
    </div>
  </div>

  <div class="composer">
    <input id="textInput" type="text" placeholder="Type a message" autocomplete="off" />
    <button id="sendButton">Send</button>
  </div>

  <div class="mic-row">
    <button id="micButton" aria-label="Hold to talk">🎙</button>
  </div>

  <div id="status"><p class="text-sm opacity-75">Type a message or tap the microphone</p></div>

  <div id="recordingIndicator" class="hidden">
    <div class="wave"></div><div class="wave"></div><div class="wave"></div>
    <div class="wave"></div><div class="wave"></div>
  </div>

  <details class="settings">
    <summary>Settings</summary>
    <label for="voiceSelect">Voice</label>
    <select id="voiceSelect"></select>
  </details>

</div>
<script src="/static/app.js"></script>
</body>
</html>
