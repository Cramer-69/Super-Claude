name: Build and push to Amazon ECR

# Builds the existing Dockerfile and pushes it to Amazon ECR on every push to
# main. Authentication uses GitHub OIDC — GitHub mints a short-lived token and
# AWS exchanges it for credentials that expire in about an hour.
#
# There are NO stored AWS keys. Nothing to leak, nothing to rotate.
#
# One-time AWS setup (already scripted, run once in CloudShell):
#   1. GitHub registered as an OIDC identity provider
#   2. IAM role "gha-super-claude" trusting only repo:Cramer-69/Super-Claude
#   3. Inline policy allowing push to the "super-claude" ECR repo only
#   4. ECR repository "super-claude" in us-west-2
#
# Then one GitHub VARIABLE (Settings -> Secrets and variables -> Actions ->
# Variables tab). A role ARN is not a secret:
#   AWS_ROLE_ARN = arn:aws:iam::209479275988:role/gha-super-claude

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: super-claude

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preflight AWS role variable
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::AWS_ROLE_ARN is missing. Run scripts/bootstrap_aws.py after AWS and GitHub login."
            exit 1
          fi

      - name: Run Python test suite
        run: |
          python -m pip install --disable-pip-version-check -r requirements-cloud.txt pytest
          python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE \
            --encryption-configuration encryptionType=AES256 >/dev/null

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
